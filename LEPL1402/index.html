<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Exam Feedback – LEPL1402</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
    <style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal" x-data="feedback()" x-cloak>

    <div class="bg-blue-600 text-white shadow">
        <div class="max-w-5xl mx-auto p-4 flex items-center justify-between">
            <h1 class="text-2xl font-bold">Exam Feedback · LEPL1402</h1>
            <button x-show="student" @click="logout()" class="text-sm bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded">Log out</button>
        </div>
    </div>

    <!-- Login -->
    <template x-if="!student">
        <div class="flex items-center justify-center py-16 px-4">
            <form @submit.prevent="login()" class="bg-white rounded-lg shadow-md p-8 w-full max-w-md space-y-4">
                <h2 class="text-xl font-bold text-gray-800">View my feedback</h2>
                <p class="text-sm text-gray-600">Enter your UCLouvain email address and the personal code you received by email.</p>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email</label>
                    <input id="email" x-model="email" type="email" required autocomplete="email"
                           class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="code">Personal code</label>
                    <input id="code" x-model="code" type="text" required autocomplete="off" spellcheck="false"
                           class="w-full p-2 border rounded font-mono uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <p x-show="error" x-text="error" class="text-sm text-red-600"></p>
                <button type="submit" :disabled="loading"
                        class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-semibold py-2 rounded">
                    <span x-text="loading ? 'Checking…' : 'View my feedback'"></span>
                </button>
            </form>
        </div>
    </template>

    <!-- Feedback -->
    <template x-if="student">
        <div class="max-w-5xl mx-auto p-8">
            <div class="bg-white rounded-lg shadow-md p-6 mb-8">
                <h2 class="text-3xl font-bold text-gray-800">Your feedback</h2>
                <div class="inline-block mt-2 bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-semibold">
                    Average Score: <span x-text="Number(student.avg).toFixed(2)"></span>/100
                </div>
            </div>

            <div x-show="Object.keys(student.exercises).length === 0" class="bg-white rounded-lg shadow-md p-6 text-gray-600">
                No submission was found for this exam.
            </div>

            <div class="space-y-8">
                <template x-for="ex in Object.keys(student.exercises)" :key="ex">
                    <div class="bg-white rounded-lg shadow-md overflow-hidden">
                        <div class="bg-gray-800 text-white p-4">
                            <h3 class="text-xl font-bold" x-text="ex"></h3>
                        </div>
                        <div class="p-6">
                            <!-- Analysis Section -->
                            <div class="mb-6 space-y-4">
                                <h4 class="text-lg font-semibold text-gray-800">AI Analysis</h4>

                                <div x-show="student.exercises[ex].analysis.compilation_error"
                                     class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4" role="alert">
                                    <p class="font-bold">Compilation Error Detected</p>
                                    <p>The submitted code could not be compiled.</p>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div class="bg-orange-50 p-4 rounded border border-orange-200">
                                        <h5 class="font-bold text-orange-800 mb-2">What went wrong</h5>
                                        <p class="text-gray-700 text-sm whitespace-pre-line" x-text="student.exercises[ex].analysis.feedback"></p>
                                    </div>
                                    <div class="bg-blue-50 p-4 rounded border border-blue-200">
                                        <h5 class="font-bold text-blue-800 mb-2">Advice for next time</h5>
                                        <p class="text-gray-700 text-sm whitespace-pre-line" x-text="student.exercises[ex].analysis.advice"></p>
                                    </div>
                                </div>

                                <div class="bg-purple-50 p-4 rounded border border-purple-200">
                                    <h5 class="font-bold text-purple-800 mb-2">Could debugging help?</h5>
                                    <p class="text-gray-700 text-sm whitespace-pre-line" x-text="student.exercises[ex].analysis.debugging_help"></p>
                                </div>
                            </div>

                            <!-- Code Section -->
                            <div>
                                <h4 class="text-lg font-semibold text-gray-800 mb-2">Submitted Code</h4>
                                <div class="relative">
                                    <pre><code class="language-java" x-text="student.exercises[ex].code"></code></pre>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </template>

    <script>
        const SALT = 'LEPL1402-feedback-v1';
        const ITERATIONS = 600000;

        function fromBase64(s) {
            return Uint8Array.from(atob(s), c => c.charCodeAt(0));
        }

        // Must match derive() in publish.py
        async function derive(email, code) {
            const enc = new TextEncoder();
            const password = email.trim().toLowerCase() + '|' + code.replace(/\s+/g, '').toUpperCase();
            const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
            const bits = new Uint8Array(await crypto.subtle.deriveBits(
                { name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(SALT), iterations: ITERATIONS }, base, 512));
            const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-GCM', false, ['decrypt']);
            const fileId = Array.from(bits.slice(32, 48), b => b.toString(16).padStart(2, '0')).join('');
            return { key, fileId };
        }

        function feedback() {
            return {
                email: '',
                code: '',
                error: '',
                loading: false,
                student: null,

                async login() {
                    this.error = '';
                    this.loading = true;
                    try {
                        const { key, fileId } = await derive(this.email, this.code);
                        const res = await fetch('d/' + fileId + '.json', { cache: 'no-store' });
                        if (!res.ok) throw new Error('not found');
                        const { iv, ct } = await res.json();
                        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromBase64(iv) }, key, fromBase64(ct));
                        this.student = JSON.parse(new TextDecoder().decode(plain));
                        this.code = '';
                        setTimeout(() => Prism.highlightAll(), 50);
                    } catch (e) {
                        this.error = 'Email or code incorrect.';
                    } finally {
                        this.loading = false;
                    }
                },

                logout() {
                    this.student = null;
                    this.email = '';
                    this.code = '';
                }
            }
        }
    </script>
</body>
</html>
